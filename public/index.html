<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Krater-Kommando</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Krater-Kommando</h1>
      <p class="tag">Artillerie-Duell für 2–4 Freunde</p>
    </header>
    <div id="conn-banner" class="banner hidden"></div>

    <!-- Lobby -->
    <section id="screen-menu" class="card">
      <label>Dein Name
        <input id="name" maxlength="16" placeholder="z. B. Simon" autocomplete="off" />
      </label>
      <button id="btn-create" class="primary">Neuen Raum erstellen</button>
      <div class="or">oder</div>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" />
        <button id="btn-join">Beitreten</button>
      </div>
      <div class="or">oder</div>
      <button id="btn-solo">Alleine gegen den Computer spielen</button>
      <p id="menu-error" class="error"></p>
      <a href="statistik.html" class="stats-link">Statistik &amp; Rekorde ansehen</a>
      <button class="link" data-help-open>Waffen &amp; Upgrades</button>
    </section>

    <!-- Waiting room -->
    <section id="screen-room" class="card hidden">
      <p>Raumcode</p>
      <div id="room-code" class="code"></div>
      <button id="btn-copy">Einladungslink kopieren</button>
      <ul id="player-list"></ul>
      <div id="bot-row" class="row">
        <select id="bot-level">
          <option value="easy">Leicht</option>
          <option value="medium" selected>Mittel</option>
          <option value="hard">Schwer</option>
        </select>
        <button id="btn-bot">+ Computergegner</button>
      </div>
      <label class="inline">Runden pro Match
        <select id="rounds">
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="10">10</option>
        </select>
      </label>
      <button id="btn-start" class="primary">Match starten</button>
      <p id="room-hint" class="hint"></p>
      <button class="link" data-help-open>Waffen &amp; Upgrades</button>
      <button id="btn-leave" class="link">Raum verlassen</button>
    </section>

    <!-- Game -->
    <section id="screen-game" class="hidden">
      <div id="topbar">
        <span id="turn-label"></span>
        <span id="round-label"></span>
        <span id="wind-label" title="In der Höhe weht der Wind stärker als am Boden."></span>
        <span id="timer-label"></span>
      </div>
      <div id="scoreboard"></div>
      <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="overlay" class="hidden">
          <div class="card wide" id="overlay-card"></div>
        </div>
      </div>
      <div id="controls">
        <div class="ctl">
          <label>Winkel <span><b id="angle-val"></b>°</span></label>
          <input id="angle" type="range" min="0" max="180" step="1" disabled />
        </div>
        <div class="ctl">
          <label>Kraft <b id="power-val"></b></label>
          <input id="power" type="range" min="10" max="100" step="1" disabled />
        </div>
        <div id="weapons"></div>
        <div id="drive">
          <button id="btn-left" title="Nach links fahren (A)" disabled>◀</button>
          <span id="fuel"></span>
          <button id="btn-right" title="Nach rechts fahren (D)" disabled>▶</button>
        </div>
        <button id="btn-help" data-help-open title="Waffen &amp; Upgrades (Taste H)">?</button>
        <button id="btn-fire" class="fire" disabled>FEUER!</button>
      </div>
      <p class="hint keys">Tastatur: ←/→ Winkel · ↑/↓ Kraft · 1–8 Waffe · S Schild · A/D fahren · Leertaste Feuer (Shift = feiner) · H Hilfe</p>
    </section>
  </main>

  <script src="/shared/physics.js"></script>
  <div id="help" class="modal hidden" role="dialog" aria-label="Waffen und Upgrades"><div class="card wide" id="help-card"></div></div>
  <script src="icons.js"></script>
  <script src="help.js"></script>
  <script src="app.js"></script>
</body>
</html>
